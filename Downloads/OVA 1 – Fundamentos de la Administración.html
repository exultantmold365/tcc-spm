<style>

:root[data-theme="dark"]{--bg:#0C1A2B;--card:#14293F;--fg:#F2F5FA;--mut:#B4C1D3;--line:#2A4260;--soft:#12363D;--ok:#5ED39A;--bad:#FF8A80}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font-family:Inter,system-ui,sans-serif;line-height:1.55}
header{background:#12263F;color:#fff;padding:26px 20px 18px}
.wrap{max-width:1060px;margin:0 auto}
.kick{font-size:13px;letter-spacing:2px;text-transform:uppercase;color:#F2A541;font-weight:600}
h1{font-family:'Space Grotesk',sans-serif;font-size:clamp(26px,5vw,40px);margin:6px 0 12px;line-height:1.1}
.bar{height:8px;background:#2A4260;border-radius:8px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:#F2A541;transition:width .3s}
.plabel{font-size:13px;color:#D5DEEA;margin-top:6px}
main.wrap{display:grid;grid-template-columns:230px 1fr;gap:20px;padding:20px}
nav{display:flex;flex-direction:column;gap:6px;align-self:start;position:sticky;top:12px}
nav button{display:flex;gap:10px;align-items:center;text-align:left;border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:10px;padding:8px 12px;font:inherit;font-size:14px;cursor:pointer;min-height:44px}

nav button.on{border-color:var(--teal);background:var(--soft);font-weight:600}

.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:28px;min-width:0}
.num{font-family:'Space Grotesk',sans-serif;font-size:52px;font-weight:700;color:var(--acc);line-height:1}

.box{border-radius:12px;padding:14px 16px;margin-top:14px}

.chip{cursor:pointer;min-height:44px}
.chip.on{background:#17757A;color:#fff;border-color:#17757A}
.cyc,.grid{display:grid;gap:10px;margin-top:14px}

.rad{position:relative;width:100%;max-width:440px;aspect-ratio:1/1;margin:14px auto}
.rad .chip{position:absolute;transform:translate(-50%,-50%);width:92px;font-size:13px;padding:6px;text-align:center;border-radius:12px}

.tl div{position:relative}.tl div::before{content:"";position:absolute;left:-26px;top:6px;width:11px;height:11px;border-radius:50%;background:var(--acc)}

.hi{display:flex;flex-direction:column;align-items:center;gap:8px;margin:14px 0}
.nd{background:#12263F;color:#fff;border-radius:12px;padding:10px 18px;font-weight:700;font-family:'Space Grotesk',sans-serif;text-align:center}
.nd.t{background:#17757A}.hk{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%}.hk .nd{font-size:14px;font-weight:600}

.btn.sec{background:transparent;color:var(--fg);border:1px solid var(--line)}

select,textarea{font:inherit;color:var(--fg);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px;max-width:100%}
select{min-height:44px}textarea{width:100%;min-height:80px}
.q{margin:14px 0;padding-bottom:10px;border-bottom:1px solid var(--line)}
.q label{display:block;padding:7px 10px;border-radius:8px;cursor:pointer}.q label:hover{background:var(--soft)}
.fb{font-size:14px;margin-top:6px;font-weight:600}.fb.ok{color:var(--ok)}.fb.bad{color:var(--bad)}
.map{display:flex;flex-direction:column;align-items:center;gap:6px;margin:14px 0}
.arrow{color:var(--mut);font-size:13px;text-align:center}
.kids{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;width:100%;margin-top:6px}
.kid{border:1px dashed var(--teal);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px}.kid small{color:var(--mut)}
.score{font-family:'Space Grotesk',sans-serif;font-size:20px;margin-top:10px}
.cv header,.cv nav{display:none}.cv main.wrap{grid-template-columns:1fr;padding:0;max-width:none}.cv .card{border:0;border-radius:0;padding:0;background:#12263F;color:#fff}
.cov{display:flex;align-items:center;justify-content:center;gap:56px;flex-wrap:wrap;padding:56px 24px;min-height:100vh;max-width:1200px;margin:0 auto}
.cov .l{flex:1 1 380px;max-width:600px;display:flex;flex-direction:column;gap:24px}
.cov h1{font-size:clamp(38px,7vw,72px);margin:0;line-height:1.03}
.cov p{margin:0;font-size:21px;line-height:1.45;color:#D5DEEA}
.cov .rt{width:min(440px,100%)}.cov .g{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:14px}
.cov .g div{border-radius:14px;padding:10px 14px;display:flex;align-items:center;gap:10px;font-weight:600;font-size:18px}
.cov .g b{font-family:'Space Grotesk',sans-serif;font-size:26px;display:block}

</style>

{t:"Definición de administración",x:"La administración es el proceso de planificar, organizar, dirigir y controlar los recursos disponibles para alcanzar objetivos de manera eficiente (usando bien los recursos) y eficaz (logrando los resultados). Recorreremos todos los conceptos con una empresa ficticia: <b>"+G+"</b>.",k:"cyc",d:[["1 · Planificación","Establecer objetivos y determinar cómo alcanzarlos.","El gimnasio decide abrir una sala de entrenamiento funcional y calcula equipos, horarios y costos."],["2 · Organización","Distribuir tareas, responsabilidades y recursos.","Asigna entrenadores por turno y un responsable de recepción."],["3 · Dirección","Orientar y coordinar el trabajo de las personas.","La gerente motiva al equipo y resuelve las dudas del día a día."],["4 · Control","Evaluar los resultados y corregir cuando sea necesario.","Revisa mensualmente asistencia y satisfacción, y ajusta las clases."]]},
{t:"Importancia de la administración",x:"Toda organización, sin importar su tamaño o actividad económica, necesita administración. Selecciona cada beneficio:",k:"grid",d:[["Aprovecha los recursos","Permite usar de forma adecuada el dinero, el tiempo, las personas y los equipos.","Evita comprar máquinas que nadie usará."],["Cumple objetivos","Facilita que la empresa alcance las metas que se propone.","Meta de nuevos socios por trimestre."],["Mejora la coordinación","Alinea el trabajo del personal.","Recepción, entrenadores y limpieza trabajan con los mismos horarios."],["Apoya decisiones","Ofrece información y criterios para decidir.","Decide ampliar horarios según la asistencia."],["Reduce errores y desperdicios","Define procesos y controles.","Mantenimiento programado de equipos."],["Facilita la adaptación","Ayuda a responder a cambios del entorno.","Lanza clases virtuales cuando baja la asistencia."]],r:"¿Qué problemas podría enfrentar una empresa que no cuenta con una administración adecuada?",q:[["¿Cuál es un beneficio de la administración?",OP,0],["Una empresa sin administración adecuada probablemente…",["Tendrá desorden, errores y desperdicio de recursos","Cumplirá siempre sus objetivos","No necesitará tomar decisiones","Se adaptará sin esfuerzo al entorno"],0]],qt:"Comprueba tu aprendizaje · Selección múltiple"},
{t:"Filosofía de la administración",x:"Es el conjunto de principios, valores, ideas y enfoques que orientan cómo una organización administra sus recursos y dirige sus actividades.",k:"grid",d:[["Principios administrativos","Reglas generales que guían la gestión.","División clara de funciones en el gimnasio."],["Ética y responsabilidad","Actuar con honestidad y responder por las decisiones.","Informar con transparencia los costos de los planes."],["Trabajo en equipo","Cooperar para lograr objetivos comunes.","Entrenadores y nutricionista diseñan programas juntos."],["Liderazgo","Inspirar y guiar al equipo.","La gerente reconoce los logros del personal."],["Eficiencia y mejora continua","Hacer mejor lo que se hace, de forma permanente.","Ajusta rutinas con base en encuestas."],["Personas y resultados","Equilibrar el bienestar de las personas con las metas.","Capacita al equipo y mide resultados."]],tl:[["Frederick Taylor · inicios del siglo XX","Administración científica: eficiencia en las tareas."],["Henri Fayol · 1916","Funciones y principios administrativos."],["Max Weber · inicios del siglo XX","Organización formal y burocracia."],["Elton Mayo · décadas de 1920 y 1930","Relaciones humanas y motivación."],["Peter Drucker · 1954","Administración por objetivos."]]},

{t:"Relación con otras disciplinas",x:"La administración usa conocimientos de otras áreas para gestionar mejor y decidir mejor. Selecciona una disciplina en el esquema:",k:"rad",c:"Administración",d:[["Economía","Ayuda a comprender recursos, costos, mercados y decisiones económicas.","Fijar el precio de la mensualidad."],["Contabilidad","Proporciona información financiera para controlar los recursos.","Registrar ingresos y gastos."],["Psicología","Permite comprender el comportamiento y la motivación de las personas.","Diseñar incentivos para el equipo."],["Sociología","Estudia las relaciones sociales y el comportamiento de los grupos.","Entender hábitos de la comunidad."],["Derecho","Establece las normas legales que debe cumplir la organización.","Contratos laborales y de afiliación."],["Matemáticas y estadística","Permiten analizar datos, calcular y proyectar.","Proyectar la asistencia del próximo año."],["Informática","Facilita procesar información y automatizar procesos.","App de reservas de clases."]],q:[["Economía","Costos, mercados y decisiones económicas",0],["Contabilidad","Información financiera para controlar los recursos",1],["Psicología","Comportamiento y motivación de las personas",2],["Derecho","Normas legales que debe cumplir la organización",3]],qo:["Costos, mercados y decisiones económicas","Información financiera para controlar los recursos","Comportamiento y motivación de las personas","Normas legales que debe cumplir la organización"],qt:"Comprueba tu aprendizaje · Relacionar columnas"},
